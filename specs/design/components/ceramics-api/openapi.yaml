openapi: 3.0.3
info:
  title: Ceramics API
  version: 0.1.0
  description: Catalog, cart, checkout, accounts, and admin order/reporting for the handmade ceramics store.
servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /products:
    get:
      operationId: listProducts
      summary: List/search published products
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: keyword search over name/description
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: matching products
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
    post:
      operationId: createProduct
      summary: Create a product (admin)
      responses:
        '201':
          description: product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProduct
      summary: Get a product's detail
      security: []
      responses:
        '200':
          description: the product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateProduct
      summary: Edit a product (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteProduct
      summary: Delete a product (admin)
      responses:
        '204':
          description: deleted
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /products/{productId}/stock:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: adjustProductStock
      summary: Adjust a product's stock count (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stockCount]
              properties:
                stockCount: { type: integer, minimum: 0 }
      responses:
        '200':
          description: updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cart:
    get:
      operationId: getCart
      summary: Get the caller's cart (guest or shopper)
      security: []
      parameters:
        - name: X-Cart-Id
          in: header
          required: false
          schema: { type: string }
          description: guest cart identifier; omit when authenticated as a shopper
      responses:
        '200':
          description: the current cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    post:
      operationId: addCartItem
      summary: Add a product to the cart
      security: []
      parameters:
        - name: X-Cart-Id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: requested quantity exceeds available stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: product not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cart/items/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
      - name: X-Cart-Id
        in: header
        required: false
        schema: { type: string }
    patch:
      operationId: updateCartItem
      summary: Change a cart line's quantity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200':
          description: updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400':
          description: requested quantity exceeds available stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: cart line not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeCartItem
      summary: Remove a product from the cart
      security: []
      responses:
        '204':
          description: removed
        '404':
          description: cart line not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /checkout:
    post:
      operationId: checkout
      summary: Validate stock, charge payment, and create an order
      security: []
      parameters:
        - name: X-Cart-Id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: order created and paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: one or more cart items are no longer in stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders:
    get:
      operationId: listOrders
      summary: List the signed-in shopper's orders, or all orders (admin)
      responses:
        '200':
          description: matching orders
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOrder
      summary: Get an order's detail
      responses:
        '200':
          description: the order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller may not view this order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{orderId}/status:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateOrderStatus
      summary: Update an order's fulfillment status (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fulfillmentStatus]
              properties:
                fulfillmentStatus:
                  type: string
                  enum: [pending, shipped, delivered, cancelled]
      responses:
        '200':
          description: updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/sales:
    get:
      operationId: getSalesReport
      summary: Sales/order-volume summary over a period (admin)
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: sales summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not a store admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /account:
    get:
      operationId: getAccount
      summary: Get the signed-in shopper's profile and saved address
      responses:
        '200':
          description: the shopper's account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateAccount
      summary: Update the signed-in shopper's saved address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '200':
          description: updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          description: not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: service is healthy

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: false
      schema: { type: string }
      description: injected by the platform gateway for authenticated callers; never set by clients directly
  schemas:
    Address:
      type: object
      required: [name, line1, city, postalCode, country]
      properties:
        name: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }
    ProductInput:
      type: object
      required: [name, description, category, price, stockCount]
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        photoUrls: { type: array, items: { type: string } }
        stockCount: { type: integer, minimum: 0 }
        published: { type: boolean, default: true }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, soldOut, createdAt]
          properties:
            id: { type: string }
            soldOut: { type: boolean }
            createdAt: { type: string, format: date-time }
    CartItem:
      type: object
      required: [productId, name, unitPrice, quantity]
      properties:
        productId: { type: string }
        name: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
    Cart:
      type: object
      required: [items, subtotal]
      properties:
        cartId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        subtotal: { type: number }
    CheckoutRequest:
      type: object
      required: [contactEmail, shippingAddress, paymentMethodToken]
      properties:
        contactEmail: { type: string, format: email }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        paymentMethodToken:
          type: string
          description: Stripe payment method / token created client-side; raw card data never reaches this API
    OrderLineItem:
      type: object
      required: [productId, name, unitPrice, quantity]
      properties:
        productId: { type: string }
        name: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
    Order:
      type: object
      required: [id, orderNumber, lineItems, subtotal, shipping, tax, total, paymentStatus, fulfillmentStatus, shippingAddress, createdAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/OrderLineItem' }
        subtotal: { type: number }
        shipping: { type: number }
        tax: { type: number }
        total: { type: number }
        paymentStatus: { type: string, enum: [paid, failed] }
        fulfillmentStatus: { type: string, enum: [pending, shipped, delivered, cancelled] }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        createdAt: { type: string, format: date-time }
    SalesReport:
      type: object
      required: [orderCount, revenue]
      properties:
        orderCount: { type: integer }
        revenue: { type: number }
    AccountInput:
      type: object
      properties:
        savedAddress: { $ref: '#/components/schemas/Address' }
    Account:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string }
        savedAddress: { $ref: '#/components/schemas/Address' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
